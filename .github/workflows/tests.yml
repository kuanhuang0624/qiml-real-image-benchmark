name: Offline core tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -c environment/core-constraints.txt -e '.[test]'
      - run: python -m pytest -q
      - run: python scripts/check_reference_results.py
      - run: python scripts/release_audit.py
      - run: qiml demo --output runs/ci_demo
