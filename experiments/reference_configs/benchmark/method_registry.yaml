adaptations:
  Yomo-Matched:
    - shared eight-dimensional ResNet18/PCA angle interface
    - eight qubits and two data-reuploading blocks
    - consecutive near-equal computational-basis outcome groups
    - source-defining probability aggregation and sharpness/entropy loss retained
  PdrQC-Matched:
    - shared eight-dimensional angle interface and eight qubits
    - candidate upload blocks restricted to RX, RY, RZ, CZ ring, and CNOT ring
    - source-defining discrimination score, weight-at-most-two Pauli pool, task-adaptive selection, and QWC grouping retained
